<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanso - Kanban Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <input type="checkbox" id="dark-mode">

  <div class="page">
    <header class="topbar">
      <div class="logo">
        <span class="logo-icon"><i></i><i></i><i></i></span>
        Kanso
      </div>
      <p class="path">Boards / Product launch / <b>Sprint 14</b></p>
      <label for="dark-mode" class="theme-btn">Dark mode</label>
    </header>

    <main>
      <div class="board-info">
        <div>
          <h1>Sprint 14</h1>
        </div>

        <div class="summary">
          <p><b id="done-summary">0 of 0</b> tasks done</p>
          <div class="summary-bar">
            <span class="bar-todo"></span>
            <span class="bar-progress"></span>
            <span class="bar-done"></span>
          </div>
          <ul class="summary-list">
            <li class="todo">To do <b id="sum-todo">0</b></li>
            <li class="progress">In progress <b id="sum-doing">0</b></li>
            <li class="done">Done <b id="sum-done">0</b></li>
          </ul>
        </div>
      </div>

      <form id="add-task-form" class="add-task-form">
        <div class="field big">
          <label for="task-title">Task</label>
          <input type="text" id="task-title" placeholder="Write the release notes" maxlength="120">
        </div>
        <div class="field">
          <label for="task-priority">Priority</label>
          <select id="task-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="field">
          <label for="task-date">Due</label>
          <input type="date" id="task-date">
        </div>
        <button type="submit">Add task</button>
      </form>
      <p id="form-error" class="form-error" role="alert"></p>

      <div class="board">

        <section class="column" data-status="todo">
          <h2 class="column-title todo">To do <span class="task-count">(0)</span></h2>
          <div class="task-list"></div>
          <div class="drop-area">Drop tasks here</div>
        </section>

        <section class="column" data-status="doing">
          <h2 class="column-title progress">In progress <span class="task-count">(0)</span></h2>
          <div class="task-list"></div>
          <div class="drop-area">Drop tasks here</div>
        </section>

        <section class="column" data-status="done">
          <h2 class="column-title done">Done <span class="task-count">(0)</span></h2>
          <div class="task-list"></div>
          <div class="drop-area">Drop tasks here</div>
        </section>

      </div>
    </main>

    <footer>Kanso · Week 2. Double-click a task title to edit it.</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
